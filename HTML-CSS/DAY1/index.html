<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>

    <style>
        h2{
            background-color: yellow;
            color: black;
        }

        h3,h4{
            background-color: green;
            color: white;
        }
    </style>

    <link rel="stylesheet" href="style.css"/>
</head>

<body style="background-color: white;">

    <h1>CSS Practice</h1>

    <h1 class="cl1">Class Selector</h1>
    <h1 id="h1">ID Selector</h1>

    <h2>Internal CSS</h2>

    <h3>Grouping Selector</h3>
    <h4>Grouping Selector</h4>

    <p class="cl2">This is a paragraph</p>

    <h1 class="cl1 cl2">Multiple Classes</h1>

    <h1 style="background-color: black; color: white;">Inline CSS</h1>

    <h2 class="rgb">RGB Color</h2>
    <h2 class="hex">HEX Color</h2>
    <h2 class="hsl">HSL Color</h2>

    <div class="box">
        <h1>Background Practice</h1>
        <p>Background color practice</p>
    </div>

</body>
</html>
